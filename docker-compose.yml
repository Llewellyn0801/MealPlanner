services:
  meal-planner:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/meal_planner.db
    ports:
      - "8000:8000"
    volumes:
      - meal_planner_data:/data
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  meal_planner_data:
